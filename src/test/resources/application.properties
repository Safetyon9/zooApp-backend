spring.application.name=projectJPA

logging.level.root=info
logging.level.com.betacom=debug

logging.file=./jpa-test.log
logging.pattern.console=%d{"yyyy/MM/dd HH:mm:ss,SSS"} [%p] [%t] %M\(%F:%L\) - %msg%n

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

mail.validation=false
mail.resetPassword=dummy-reset-password
mail.from=noreply@test.local
mail.subject.reset=Reset Password Test
mail.subject.validation=Validation Test

lang=IT
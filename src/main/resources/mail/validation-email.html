<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Validazione account</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f6f8; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">
          <tr>
            <td style="background-color:#166534; padding:24px 32px; color:#ffffff; font-size:24px; font-weight:bold;">
              Zoo Betacom Roma
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 20px 0; font-size:24px; color:#111827;">Verifica email</h2>

              <p style="margin:0 0 17px 0; font-size:16px; line-height:1.6;">
                Buongiorno <strong>{{username}}</strong>,
              </p>

              <p style="margin:0 0 24px 0; font-size:16px; line-height:1.6;">
                Per completare la registrazione e validare il tuo account, clicca sul pulsante qui sotto:
              </p>

              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 24px 0;">
                <tr>
                  <td bgcolor="#166534" style="border-radius:8px;">
                    <a href="{{link}}"
                       target="_blank"
                       style="display:inline-block; padding:14px 24px; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:8px;">
                      Valida account
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 12px 0; font-size:14px; line-height:1.6; color:#4b5563;">
                Se il pulsante non funziona, copia e incolla questo link nel browser:
              </p>

              <p style="margin:0 0 24px 0; font-size:14px; line-height:1.6; word-break:break-all;">
                <a href="{{link}}" target="_blank" style="color:#2563eb; text-decoration:none;">
                  {{link}}
                </a>
              </p>

              <p style="margin:24px 0 0 0; font-size:14px; line-height:1.6; color:#6b7280;">
                Il team di Roma1 di Betacom
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
